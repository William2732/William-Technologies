<!DOCTYPE html>
<html lang="en">
    <head>
        <title>log_in</title>
        <link rel="stylesheet" href="log_in.css">
        <link rel="icon" type="image/png" href="favicon.png">
    </head>
    <body><span class="sp">
         <nav>
            <a href="index.html" class="aa">HOME</a>
         </nav>
         </span>
           <form class="log">
            <label for="text" >FULL NAME: </label>
            <input type="text" id="text" placeholder="Enter your full name" class="frm">
            <br><br>
            <label for="email" >EMAIL ADDRESS:</label>
            <input type="email" id="email" placeholder="Enter your email address" class="frm">
            <br><br>
            <label for="contact">PHONE NUMBER:</label>
            <input type="contact" id="contact" placeholder="Example +254 712 345 678" class="frm">
            <br><br>
            <label for="password">PASSWORD:</label>
            <input type="password" id="password" placeholder="Input password" class="frm">
            <br><br>
            <label for="confirm-password">CONFIRM PASSWORD:</label>
            <input type="password" id="confirm-password" placeholder="Confirm password" class="frm"><br>
             <h3>Are you new? <a href="" style="color: rgb(23, 209, 200);">Create an Account</a></h3>
            <br><br>
            <button type="submit">SUBMIT</button>
           </form>

</html>
